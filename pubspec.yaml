name: evolvix
description: "evolvix a gamified app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  firebase_storage: ^12.4.1
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.6.12
  csv: ^6.0.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  timeago: ^3.7.0
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/evolvix_logo_wt.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0118"
  adaptive_icon_foreground: "assets/images/evolvix_logo_wt.png"

flutter_native_splash:
  color: "#0D051A"
  image: "assets/images/evolvix_logo_wt.png"
  
  android_12:
    color: "#0D051A"
    image: "assets/images/evolvix_logo_wt.png"
    icon_background_color: "#0D051A"

  android: true
  ios: true
  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
